  <!-- dial: one ring, four cardinal points -->
  <g transform="translate(870 300)">
    <circle r="190" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="0" cy="-190" r="6" fill="#4285F4" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
    <circle cx="190" cy="0" r="6" fill="#EA4335"/>
    <circle cx="0" cy="190" r="6" fill="#FBBC05"/>
    <circle cx="-190" cy="0" r="6" fill="#34A853"/>

