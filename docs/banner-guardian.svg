<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="bg" cx="0.86" cy="0.1" r="1.2">
      <stop offset="0" stop-color="#4f9ff0"/>
      <stop offset="0.35" stop-color="#1f56c4"/>
      <stop offset="0.7" stop-color="#0a2470"/>
      <stop offset="1" stop-color="#040b26"/>
    </radialGradient>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.35" stop-color="#9fe3ff"/>
      <stop offset="0.6" stop-color="#b9a8ff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <symbol id="bn" overflow="visible">
      <circle cx="0" cy="0" r="2.1" fill="#ffffff"/>
      <circle cx="0" cy="14" r="2.1" fill="#ffffff"/>
      <circle cx="7" cy="0" r="2.1" fill="#ffffff"/>
      <circle cx="7" cy="7" r="2.1" fill="#ffffff"/>
    </symbol>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- braille "N" stars: the north mark, in the alphabet our users read -->
  <g>
    <use href="#bn" x="398" y="107" opacity="0.73"/>
    <use href="#bn" x="769" y="64" opacity="0.50"/>
    <use href="#bn" x="638" y="224" opacity="0.72"/>
    <use href="#bn" x="109" y="74" opacity="0.73"/>
    <use href="#bn" x="512" y="477" opacity="0.46"/>
    <use href="#bn" x="171" y="146" opacity="0.40"/>
    <use href="#bn" x="742" y="543" opacity="0.40"/>
    <use href="#bn" x="1138" y="50" opacity="0.39"/>
    <use href="#bn" x="380" y="471" opacity="0.39"/>
    <use href="#bn" x="652" y="58" opacity="0.58"/>
    <use href="#bn" x="544" y="188" opacity="0.71"/>
    <use href="#bn" x="626" y="504" opacity="0.68"/>
    <use href="#bn" x="75" y="390" opacity="0.52"/>
    <use href="#bn" x="983" y="542" opacity="0.59"/>
    <use href="#bn" x="568" y="388" opacity="0.66"/>
    <use href="#bn" x="468" y="390" opacity="0.34"/>
    <use href="#bn" x="221" y="88" opacity="0.60"/>
    <use href="#bn" x="35" y="254" opacity="0.71"/>
    <use href="#bn" x="1112" y="402" opacity="0.65"/>
    <use href="#bn" x="1051" y="451" opacity="0.64"/>
    <use href="#bn" x="475" y="243" opacity="0.52"/>
    <use href="#bn" x="148" y="372" opacity="0.38"/>
    <use href="#bn" x="30" y="107" opacity="0.66"/>
    <use href="#bn" x="59" y="503" opacity="0.45"/>
    <use href="#bn" x="559" y="289" opacity="0.66"/>
    <use href="#bn" x="220" y="447" opacity="0.74"/>
    <use href="#bn" x="434" y="40" opacity="0.48"/>
    <use href="#bn" x="62" y="177" opacity="0.48"/>
    <use href="#bn" x="324" y="404" opacity="0.73"/>
  </g>

  <!-- dial: one ring, four cardinal points -->
  <g transform="translate(870 300)">
    <circle r="190" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="0" cy="-190" r="6" fill="#4285F4" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
    <circle cx="190" cy="0" r="6" fill="#EA4335"/>
    <circle cx="0" cy="190" r="6" fill="#FBBC05"/>
    <circle cx="-190" cy="0" r="6" fill="#34A853"/>

    <!-- needle -->
    <g transform="rotate(18)">
      <polygon points="0,-150 26,0 0,0" fill="#ffffff"/>
      <polygon points="0,-150 -26,0 0,0" fill="url(#iri)"/>
      <polygon points="0,150 26,0 0,0" fill="#ffffff" fill-opacity="0.28"/>
      <polygon points="0,150 -26,0 0,0" fill="#ffffff" fill-opacity="0.14"/>
      <circle r="7" fill="#ffffff"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(130 324)">
    <text x="0" y="0" fill="#ffffff" font-family="'Google Sans', 'Product Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="500" letter-spacing="-0.5">Compass</text>
    <!-- braille "N" (dots 1, 3, 4, 5) -->
    <g transform="translate(4 -96)" fill="#ffffff" fill-opacity="0.7">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="0" cy="20" r="3"/>
      <circle cx="10" cy="0" r="3"/>
      <circle cx="10" cy="10" r="3"/>
    </g>
  </g>
</svg>
