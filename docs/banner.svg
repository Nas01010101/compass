<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="bg" cx="0.92" cy="0.02" r="1.25">
      <stop offset="0" stop-color="#5fb4f5"/>
      <stop offset="0.28" stop-color="#2b6fd8"/>
      <stop offset="0.62" stop-color="#0d2f8a"/>
      <stop offset="1" stop-color="#030a26"/>
    </radialGradient>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.3" stop-color="#9fe3ff"/>
      <stop offset="0.5" stop-color="#7cf0d8"/>
      <stop offset="0.68" stop-color="#b9a8ff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="frost" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- scattered "N" glyphs, the compass north mark -->
  <g fill="#ffffff" fill-opacity="0.75" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <text x="62" y="58">N</text><text x="238" y="52">N</text><text x="372" y="28">N</text><text x="516" y="66">N</text>
    <text x="72" y="118">N</text><text x="356" y="130">N</text><text x="630" y="130">N</text><text x="1108" y="34">N</text>
    <text x="146" y="160">N</text><text x="400" y="192">N</text><text x="34" y="330">N</text><text x="648" y="290">N</text>
    <text x="96" y="434">N</text><text x="588" y="414">N</text><text x="612" y="436">N</text><text x="282" y="496">N</text>
    <text x="96" y="578">N</text><text x="134" y="580">N</text><text x="462" y="562">N</text><text x="690" y="572">N</text>
    <text x="1172" y="306">N</text><text x="1072" y="348">N</text><text x="1140" y="520">N</text><text x="1046" y="566">N</text>
  </g>

  <!-- crystal compass needle -->
  <g transform="translate(860 300) rotate(18)">
    <ellipse cx="0" cy="0" rx="150" ry="230" fill="#7fd8ff" fill-opacity="0.35" filter="url(#glow)"/>
    <g filter="url(#soft)">
      <polygon points="0,-250 62,-28 0,0" fill="url(#frost)"/>
      <polygon points="0,-250 -62,-28 0,0" fill="url(#iri)" fill-opacity="0.92"/>
      <polygon points="0,250 62,28 0,0" fill="url(#iri)" fill-opacity="0.8"/>
      <polygon points="0,250 -62,28 0,0" fill="url(#frost)" fill-opacity="0.85"/>
      <polygon points="-62,-28 -62,28 0,0" fill="#dff3ff" fill-opacity="0.8"/>
      <polygon points="62,-28 62,28 0,0" fill="#a8d8ff" fill-opacity="0.75"/>
    </g>
    <polyline points="0,-250 0,250" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
    <polyline points="-62,-28 0,0 62,28" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <circle r="14" fill="#ffffff" fill-opacity="0.9"/>
    <circle r="6" fill="#7cc7ff"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(150 300)">
    <circle cx="0" cy="-10" r="24" fill="none" stroke="url(#iri)" stroke-width="5"/>
    <polygon points="0,-30 7,-10 0,-6 -7,-10" fill="#ffffff"/>
    <polygon points="0,10 7,-10 0,-14 -7,-10" fill="#9fe3ff"/>
    <text x="46" y="8" fill="#ffffff" font-family="'Google Sans', 'Product Sans', Helvetica, Arial, sans-serif" font-size="62" font-weight="500" letter-spacing="-0.5">Compass</text>
    <text x="48" y="52" fill="#cfe2ff" fill-opacity="0.85" font-family="Helvetica, Arial, sans-serif" font-size="19">A browser agent that stays on the course you set</text>
  </g>
</svg>
